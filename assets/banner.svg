<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <radialGradient id="bp" cx="12%" cy="0%" r="60%"><stop offset="0" stop-color="#ff00e6" stop-opacity=".75"/><stop offset="1" stop-color="#ff00e6" stop-opacity="0"/></radialGradient>
    <radialGradient id="bc" cx="95%" cy="100%" r="60%"><stop offset="0" stop-color="#00f0ff" stop-opacity=".6"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="bv" cx="55%" cy="55%" r="40%"><stop offset="0" stop-color="#6a00ff" stop-opacity=".45"/><stop offset="1" stop-color="#6a00ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gNeon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset=".55" stop-color="#8a5cff"/><stop offset="1" stop-color="#ff00e6"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6a8"/><stop offset=".5" stop-color="#ffd000"/><stop offset="1" stop-color="#ff8a00"/></linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="round"><rect width="1200" height="360" rx="26"/></clipPath>
    <style>
      .t{font-family:'Segoe UI Black','Arial Black',Impact,sans-serif;font-weight:900}
      .m{font-family:'Cascadia Code',Consolas,'Courier New',monospace}
      .orbit{transform-origin:170px 180px;animation:spin 14s linear infinite}
      .crown{animation:bob 3s ease-in-out infinite}
      .flick{animation:flick 5s infinite}
      .blob1{animation:drift 12s ease-in-out infinite alternate}
      .blob2{animation:drift 15s ease-in-out infinite alternate-reverse}
      .caret{animation:blink 1s steps(1) infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{50%{transform:translateY(-4px)}}
      @keyframes flick{0%,19%,21%,55%,57%,100%{opacity:1}20%,56%{opacity:.4}}
      @keyframes drift{to{transform:translate(60px,30px)}}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="#05030f"/>
    <rect class="blob1" x="-100" y="-100" width="1400" height="560" fill="url(#bp)"/>
    <rect class="blob2" x="-100" y="-100" width="1400" height="560" fill="url(#bc)"/>
    <rect width="1200" height="360" fill="url(#bv)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <!-- glass panel -->
    <rect x="30" y="30" width="1140" height="300" rx="22" fill="url(#glassG)" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="30" y="30" width="1140" height="1.5" fill="#fff" fill-opacity=".25"/>

    <!-- emblem -->
    <g transform="translate(170 180)">
      <circle class="orbit" cx="0" cy="0" r="112" fill="none" stroke="url(#gNeon)" stroke-width="2.4" stroke-dasharray="10 16" opacity=".8" style="transform-origin:0 0"/>
      <g transform="translate(-120 -120) scale(2)">
        <g filter="url(#soft)" stroke="url(#gNeon)" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M40 30v-9M52 30v-9M68 30v-9M80 30v-9M40 99v-9M52 99v-9M68 99v-9M80 99v-9M30 44h-9M30 56h-9M30 68h-9M30 80h-9M99 44h-9M99 56h-9M99 68h-9M99 80h-9"/>
          <rect x="30" y="30" width="60" height="60" rx="9" fill="#080619"/>
          <rect x="37" y="37" width="46" height="46" rx="5" stroke-width="1.2" opacity=".55"/>
        </g>
        <g class="crown" filter="url(#soft)">
          <path d="M41 72 L38 49 L50 59 L60 43 L70 59 L82 49 L79 72 Z" fill="url(#gGold)" stroke="#fff3b0" stroke-width="1.2" stroke-linejoin="round"/>
          <rect x="41" y="73.5" width="38" height="5" rx="2" fill="url(#gGold)"/>
          <circle cx="38" cy="48" r="3" fill="#ff00e6"/><circle cx="60" cy="42" r="3.4" fill="#00f0ff"/><circle cx="82" cy="48" r="3" fill="#ff00e6"/>
          <circle cx="60" cy="64" r="2.6" fill="#05030f" stroke="#00f0ff" stroke-width="1.2"/>
        </g>
      </g>
    </g>

    <!-- wordmark -->
    <g class="t" font-size="92" letter-spacing="6">
      <text x="330" y="175" fill="#eaffff" filter="url(#glow)" class="flick">ESP32</text>
      <text x="688" y="175" fill="url(#gGold)" filter="url(#glow)">KING</text>
    </g>
    <text x="334" y="215" class="t" font-size="18" letter-spacing="9" fill="#7ff8ff" filter="url(#soft)">EMBEDDED · WIFI · BLE · MAKER</text>

    <!-- terminal line -->
    <rect x="330" y="240" width="640" height="46" rx="12" fill="#000" fill-opacity=".55" stroke="#00f0ff" stroke-opacity=".35"/>
    <text x="350" y="270" class="m" font-size="18" fill="#e9f6ff"><tspan fill="#7cff00">krishna@up61</tspan><tspan fill="#00f0ff">:~$</tspan> flash --like-a-king</text>
    <rect class="caret" x="738" y="255" width="10" height="20" fill="#00f0ff" filter="url(#soft)"/>

    <!-- tag chips -->
    <g class="m" font-size="14" font-weight="700">
      <rect x="1000" y="70" width="140" height="34" rx="17" fill="#000" fill-opacity=".4" stroke="#ff00e6"/>
      <text x="1070" y="92" text-anchor="middle" fill="#ff7cf3">🇮🇳 INDIA</text>
      <rect x="1000" y="116" width="140" height="34" rx="17" fill="#000" fill-opacity=".4" stroke="#00f0ff"/>
      <text x="1070" y="138" text-anchor="middle" fill="#7ff8ff">ESP32 · 8266</text>
      <rect x="1000" y="162" width="140" height="34" rx="17" fill="#000" fill-opacity=".4" stroke="#7cff00"/>
      <text x="1070" y="184" text-anchor="middle" fill="#b6ff6b">C++ · ARDUINO</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="26" fill="none" stroke="url(#gNeon)" stroke-width="2" opacity=".8"/>
</svg>
